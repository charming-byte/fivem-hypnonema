# Allow admin access to everything
add_ace group.admin hypnonema allow

# Allow everyone to use hypnonema
add_ace builtin.everyone hypnonema.use allow

# Allow moderators to control hypnonema
add_ace group.moderators hypnonema.control allow

# Screen management (saving/deleting screens) is admin-only by default, since it
# persists changes to disk. To let moderators manage screens too, uncomment:
# add_ace group.moderators hypnonema.manage-screens allow