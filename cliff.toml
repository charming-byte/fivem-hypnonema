# git-cliff configuration - https://git-cliff.org/docs/configuration
#
# Changelog is generated from Conventional Commit messages
# (feat:, fix:, perf:, docs:, ...). Commits that don't match are dropped.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated from the commit history.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^revert", group = "Revert" },
  { message = "^build|^ci", group = "Build & CI" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore|^style|^test", skip = true },
  { body = ".*security", group = "Security" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
