name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    # net481 targeting pack ships with the Windows runner image; building the
    # .NET Framework assemblies on Linux would need extra reference-assembly
    # plumbing, so the whole monorepo build runs on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools
        working-directory: apps/server-script
        run: dotnet tool restore

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Assemble resource
        shell: bash
        run: .github/scripts/assemble-resource.sh "ci-${{ github.sha }}"

      - name: Upload resource artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypnonema-ci
          path: |
            dist/hypnonema
            dist/hypnonema-map
          retention-days: 14
